name: Deploy Portal API to Google Cloud Run

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "apps/api/**"
      - "packages/**"
      - "prisma/**"
      - "Dockerfile.api"
      - "Dockerfile"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Determine Environment Variables
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "ENV_NAME=production" >> $GITHUB_ENV
            echo "SERVICE_NAME=devlab-portal-api" >> $GITHUB_ENV
            echo "DB_URL=${{ secrets.DATABASE_URL_PROD }}" >> $GITHUB_ENV
          else
            echo "ENV_NAME=development" >> $GITHUB_ENV
            echo "SERVICE_NAME=devlab-portal-api-dev" >> $GITHUB_ENV
            echo "DB_URL=${{ secrets.DATABASE_URL_DEV }}" >> $GITHUB_ENV
          fi

      - name: Prepare Container Entrypoint
        run: |
          if [ -f Dockerfile.api ]; then
            cp Dockerfile.api Dockerfile
          fi

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --source . \
            --region asia-southeast1 \
            --allow-unauthenticated \
            --port 4000 \
            --memory 512Mi \
            --cpu 1 \
            --set-env-vars "NODE_ENV=${{ env.ENV_NAME }},DATABASE_URL=${{ env.DB_URL }},SESSION_SECRET=${{ secrets.SESSION_SECRET }},PORTAL_ORIGIN=http://localhost:3000,OIDC_ISSUER=https://${{ env.SERVICE_NAME }}-293436328335.asia-southeast1.run.app" \
            --quiet
