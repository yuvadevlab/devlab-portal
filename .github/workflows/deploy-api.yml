name: 🚀 Deploy Portal API to Google Cloud Run

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "apps/api/**"
      - "packages/**"
      - "prisma/**"
      - "Dockerfile.api"
      - "Dockerfile"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: ⚡ Pre-Flight Quality Gate
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!contains(github.event.head_commit.message, 'sync/main-to-dev') &&
       !contains(github.event.head_commit.message, 'reverse merge main into dev') &&
       !contains(github.event.head_commit.message, 'chore(sync):'))
    uses: yuvadevlab/.github/.github/workflows/reusable-ci.yml@main
    with:
      node-version: "22"
      run-tests: true

  deploy-dev:
    name: 🚢 Deploy Development
    needs: [validate]
    if: github.ref == 'refs/heads/dev'
    uses: yuvadevlab/.github/.github/workflows/reusable-deploy-cloudrun.yml@main
    with:
      service-name: "devlab-portal-api-dev"
      dockerfile: "Dockerfile.api"
      port: 4000
      memory: "512Mi"
      cpu: "1"
      min-instances: 0
      max-instances: 2
      concurrency: 80
      cpu-boost: true
      env-vars: |
        NODE_ENV=development
        DATABASE_URL=${{ secrets.DATABASE_URL_DEV }}
        SESSION_SECRET=${{ secrets.SESSION_SECRET }}
        PORTAL_ORIGIN=${{ vars.PORTAL_ORIGIN_DEV }}
        CORS_ALLOWED_ORIGINS=${{ vars.CORS_ALLOWED_ORIGINS_DEV }}
        OIDC_ISSUER=https://devlab-portal-api-dev-293436328335.asia-southeast1.run.app
    secrets:
      WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
      WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}

  deploy-prod:
    name: 🚀 Deploy Production
    needs: [validate]
    if: github.ref == 'refs/heads/main'
    uses: yuvadevlab/.github/.github/workflows/reusable-deploy-cloudrun.yml@main
    with:
      service-name: "devlab-portal-api"
      dockerfile: "Dockerfile.api"
      port: 4000
      memory: "512Mi"
      cpu: "1"
      min-instances: 1
      max-instances: 5
      concurrency: 80
      cpu-boost: true
      env-vars: |
        NODE_ENV=production
        DATABASE_URL=${{ secrets.DATABASE_URL_PROD }}
        SESSION_SECRET=${{ secrets.SESSION_SECRET }}
        PORTAL_ORIGIN=${{ vars.PORTAL_ORIGIN_PROD }}
        CORS_ALLOWED_ORIGINS=${{ vars.CORS_ALLOWED_ORIGINS_PROD }}
        OIDC_ISSUER=https://devlab-portal-api-293436328335.asia-southeast1.run.app
    secrets:
      WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
      WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}
