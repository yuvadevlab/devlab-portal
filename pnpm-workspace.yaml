packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  "@apollo/protobufjs": true
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - "@yuva-devlab/logger@1.2.0"
  - "@yuva-devlab/tokens@1.2.0"
  - "@yuva-devlab/ui@1.4.0"
  - "@yuva-devlab/auth-client@0.2.0 || 0.3.0 || 1.0.0"
