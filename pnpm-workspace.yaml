packages:
  - "apps/*"
allowBuilds:
  "@apollo/protobufjs": true
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - "@yuva-devlab/logger@1.2.0"
overrides:
  "@yuva-devlab/tokens": link:../devlab-shared/packages/tokens
  "@yuva-devlab/ui": link:../devlab-shared/packages/ui
